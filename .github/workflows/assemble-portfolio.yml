name: Assemble portfolio files

on:
  push:
    paths:
      - 'payload/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflows tests web
          cat payload/02.part* | base64 -d | gunzip > workflows/02_ai_lead_qualification.json
          cat payload/03.part* | base64 -d | gunzip > workflows/03_calendly_booking_handler.json
          cat payload/05.part* | base64 -d | gunzip > workflows/05_portfolio_demo_form.json
          cat payload/tests.part* | base64 -d | gunzip > tests/run-all-tests.ps1
          cat payload/web.part* | base64 -d | gunzip > web/demo-form.html

          jq -s 'add' \
            workflows/00_setup_data_tables.json \
            workflows/01_twenty_connectivity_check.json \
            workflows/02_ai_lead_qualification.json \
            workflows/03_calendly_booking_handler.json \
            workflows/04_global_error_handler.json \
            workflows/05_portfolio_demo_form.json \
            > workflows/all_workflows.json

          jq empty workflows/*.json

      - name: Commit assembled files
        shell: bash
        run: |
          rm -rf payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Assemble portfolio workflows and demo assets"
          git push
